<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Catcher: Cosmic Rush</title><link rel="stylesheet" href="style.css">
</head>
<body><main>
<header><span>ARCADE SPACE CHALLENGE</span><h1>Star Catcher <em>Cosmic Rush</em></h1>
<p>Kumpulkan bintang, bangun combo, dan hindari hujan meteor!</p></header>
<section class="hud">
<div><small>SKOR</small><b id="score">0</b></div>
<div><small>NYAWA</small><b id="lives">3</b></div>
<div><small>WAKTU</small><b id="time">60</b></div>
<div><small>REKOR</small><b id="best">0</b></div>
<div><small>COMBO</small><b id="combo">x1</b></div>
</section>
<canvas id="game" width="800" height="450" aria-label="Arena permainan Star Catcher"></canvas>
<nav><button type="button" id="left" aria-label="Gerak kiri">◀ Kiri</button><button type="button" id="start">Mulai permainan</button><button type="button" id="pause">Jeda</button><button type="button" id="right" aria-label="Gerak kanan">Kanan ▶</button></nav>
<p class="help">Keyboard: ← → / A D untuk bergerak · P untuk jeda · Enter untuk mulai ulang · Sentuh tombol untuk bermain</p>
<p id="status" role="status">Siap beraksi? Tekan Mulai permainan.</p>
</main><script src="game.js"></script></body></html>
